# Agent #1 — deploy + verify. Spec: docs/agents/01-deploy-agent.md
#
#   test ─▶ deploy ─▶ live smoke ─(fail)▶ auto-rollback hosting
#                   └▶ critical-process health ─▶ Telegram report
#
# Secrets (repo → Settings → Secrets → Actions):
#   FIREBASE_SA            deploy service-account JSON key
#   VITE_FIREBASE_API_KEY  VITE_FIREBASE_APP_ID      (web/.env values)
#   TELEGRAM_BOT_TOKEN     TELEGRAM_CHAT_ID          (optional TELEGRAM_THREAD_ID)
#   SMOKE_EMAIL            SMOKE_PASSWORD            read-only account in config/league.smokeUIDs
# Reporting is failure-only; set repo variable REPORT_ALWAYS=true to hear about green runs too.
name: Deploy + verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TZ: America/Chicago
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm i -g firebase-tools@13
      - name: Install
        run: |
          (cd web && npm ci)
          (cd functions && npm ci)
          (cd tests/rules && npm ci)
      - name: Unit tests — web
        run: cd web && npm test
      - name: Unit tests — functions
        run: cd functions && node --test *.test.js
      - name: Unit tests — CI scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Rules — emulator
        run: cd tests/rules && npm test
      - name: Smoke — preview build (every phase)
        run: |
          cd web
          npx playwright install --with-deps chromium
          PW_PROJECT=preview npx playwright test --project=preview
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-preview, path: web/test-results, retention-days: 7 }

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      prev_version: ${{ steps.prev.outputs.version }}
      smoke: ${{ steps.smoke.outcome }}
      rolled_back: ${{ steps.rollback.outcome == 'success' }}
      health: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm i -g firebase-tools@13
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
          token_format: access_token

      - name: Record the live hosting version (rollback target)
        id: prev
        run: |
          v=$(curl -fsS -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            https://firebasehosting.googleapis.com/v1beta1/sites/iffl-auth/channels/live \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).release?.version?.name||"";console.log(n.split("/").pop())})')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: ${v:-<none>}"

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # A config that cannot work must never reach a build. Sep 26, 2026: a
          # bad API key deployed green because nothing in the pipeline signed in.
          node .github/scripts/check-firebase-env.mjs
          cd web && npm ci
          {
            echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=iffl-auth.firebaseapp.com"
            echo "VITE_FIREBASE_PROJECT_ID=iffl-auth"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=876749980452"
            echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
          } > .env
          npm run build

      - name: Deploy hosting + rules + functions
        run: |
          (cd functions && npm ci)
          firebase deploy --project iffl-auth --only hosting,firestore:rules,functions --non-interactive

      - name: Smoke — live site
        id: smoke
        continue-on-error: true
        run: |
          cd web
          npx playwright install --with-deps chromium
          sleep 20   # CDN propagation
          PW_PROJECT=live SMOKE_URL=https://iffl-auth.web.app npx playwright test --project=live
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

      - name: Auto-rollback hosting
        id: rollback
        if: steps.smoke.outcome == 'failure' && steps.prev.outputs.version != ''
        run: |
          firebase hosting:clone "iffl-auth@${{ steps.prev.outputs.version }}" iffl-auth:live --project iffl-auth   # site@VERSION, not site:@VERSION (that parses as a channel)
          echo "Rolled hosting back to ${{ steps.prev.outputs.version }}. Rules and functions were NOT rolled back."

      - name: Critical-process health
        id: health
        continue-on-error: true
        env:
          HEALTH_OUT: ${{ runner.temp }}/health.md
        run: node functions/scripts/check-health.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-report
          path: |
            ${{ runner.temp }}/health.md
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the run if smoke or health failed
        if: steps.smoke.outcome == 'failure' || steps.health.outcome == 'failure'
        run: exit 1

  report:
    needs: [test, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TEST: ${{ needs.test.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.deploy.outputs.smoke }}
          ROLLED_BACK: ${{ needs.deploy.outputs.rolled_back }}
          HEALTH: ${{ needs.deploy.outputs.health }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          REPORT_ALWAYS: ${{ vars.REPORT_ALWAYS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/report.mjs

  # ── Deploy Captain (brain/deploy) — additive; the jobs above are Agent #1's and unchanged ──
  estate:
    # Same outcome as the Telegram report, into Supabase estate_events (urn est:deploy:iffl-app),
    # so the estate status views and the Deploy Captain digest see the web app.
    needs: [test, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ESTATE_SUPABASE_URL: ${{ secrets.ESTATE_SUPABASE_URL }}
      ESTATE_SUPABASE_ANON_KEY: ${{ secrets.ESTATE_SUPABASE_ANON_KEY }}
      ESTATE_INGEST_TOKEN: ${{ secrets.ESTATE_INGEST_TOKEN }}
      TEST: ${{ needs.test.result }}
      DEPLOY: ${{ needs.deploy.result }}
      SMOKE: ${{ needs.deploy.outputs.smoke }}
      ROLLED_BACK: ${{ needs.deploy.outputs.rolled_back }}
      PREV: ${{ needs.deploy.outputs.prev_version }}
      HEALTH: ${{ needs.deploy.outputs.health }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Report to estate
        run: |
          r=.github/estate-report.sh
          detail="{\"test\":\"$TEST\",\"deploy\":\"$DEPLOY\",\"smoke\":\"$SMOKE\",\"health\":\"$HEALTH\",\"rolled_back\":\"$ROLLED_BACK\",\"prev_version\":\"$PREV\"}"
          if [ "$SMOKE" = success ]; then
            bash $r probe ok "live smoke passed on iffl-auth.web.app" "$detail"
          elif [ "$SMOKE" = failure ]; then
            bash $r probe error "live smoke FAILED on iffl-auth.web.app" "$detail"
          fi
          if [ "$ROLLED_BACK" = true ]; then
            bash $r action warn "hosting rolled back to $PREV (rules + functions NOT rolled back)" "$detail"
          fi
          if [ "$TEST" != success ]; then
            status=error; summary="tests failed — nothing deployed"
          elif [ "$DEPLOY" = success ]; then
            status=ok; summary="green: test, deploy, live smoke, health"
          elif [ "$ROLLED_BACK" = true ]; then
            status=error; summary="live smoke failed — hosting rolled back to $PREV"
          elif [ "$HEALTH" = failure ]; then
            status=error; summary="deployed, but critical-process health check failed"
          else
            status=error; summary="deploy failed (deploy=$DEPLOY)"
          fi
          bash $r run "$status" "[$GITHUB_EVENT_NAME $GITHUB_REF_NAME] $summary" "$detail"

  claude-fix:
    # Main-branch failures only. Opens a fix PR; never pushes to main, never merges.
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [estate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - name: Claude — diagnose and open fix PR
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Deploy Captain fixer for ${{ github.repository }} — the IFFL web app on
            Firebase project iffl-auth. Read CLAUDE.md and docs/agents/01-deploy-agent.md first.
            The "Deploy + verify" workflow failed on `main` at ${{ github.sha }}.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            1. Read the failed logs: `gh run view ${{ github.run_id }} --log-failed`.
            2. If an open PR from a `claude/fix-*` branch already targets this failure,
               comment on it with the new evidence and stop.
            3. Root-cause it. "Flaky" is not a root cause.
               - Code/config cause → minimal fix on branch `claude/fix-${{ github.run_id }}`,
                 run the web / functions tests locally, commit, push, and
                 `gh pr create --base main` with cause, fix, and how you verified it.
               - Infra cause (missing/expired secret, Firebase quota, smoke account) → no code
                 change; open one issue titled "Deploy Captain: <cause>" with the exact fix,
                 unless an open issue with that title exists.
            Hosting was already auto-rolled back if the live smoke failed — rules and functions
            were not. Say so in the PR if relevant.
            Never push to `main`. Never merge. Never skip, disable, or delete a test.
            Never change the rollback or smoke logic to make a run pass. Never commit secrets.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"
