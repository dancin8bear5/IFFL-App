# Agent #1 — deploy + verify. Spec: docs/agents/01-deploy-agent.md
#
#   test ─▶ deploy ─▶ live smoke ─(fail)▶ auto-rollback hosting
#                   └▶ critical-process health
#
# ON DEMAND ONLY (Oct 5, 2026): pushes and PRs run `test`; nothing deploys unless someone runs
# this workflow by hand — Actions → "Deploy + verify" → Run workflow (main), or
# `gh workflow run deploy.yml --ref main`. The Telegram report was removed with the automation.
#
# Secrets (repo → Settings → Secrets → Actions):
#   FIREBASE_SA            deploy service-account JSON key
#   VITE_FIREBASE_API_KEY  VITE_FIREBASE_APP_ID      (web/.env values)
#   SMOKE_EMAIL            SMOKE_PASSWORD            read-only account in config/league.smokeUIDs
name: Deploy + verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TZ: America/Chicago
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm i -g firebase-tools@13
      - name: Install
        run: |
          (cd web && npm ci)
          (cd functions && npm ci)
          (cd tests/rules && npm ci)
      - name: Unit tests — web
        run: cd web && npm test
      - name: Unit tests — functions
        run: cd functions && node --test *.test.js
      - name: Unit tests — CI scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Rules — emulator
        run: cd tests/rules && npm test
      - name: Smoke — preview build (every phase)
        run: |
          cd web
          npx playwright install --with-deps chromium
          PW_PROJECT=preview npx playwright test --project=preview
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-preview, path: web/test-results, retention-days: 7 }

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      prev_version: ${{ steps.prev.outputs.version }}
      smoke: ${{ steps.smoke.outcome }}
      rolled_back: ${{ steps.rollback.outcome == 'success' }}
      health: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm i -g firebase-tools@13
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
          token_format: access_token

      - name: Record the live hosting version (rollback target)
        id: prev
        run: |
          v=$(curl -fsS -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            https://firebasehosting.googleapis.com/v1beta1/sites/iffl-auth/channels/live \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).release?.version?.name||"";console.log(n.split("/").pop())})')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: ${v:-<none>}"

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # A config that cannot work must never reach a build. Sep 26, 2026: a
          # bad API key deployed green because nothing in the pipeline signed in.
          node .github/scripts/check-firebase-env.mjs
          cd web && npm ci
          {
            echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=iffl-auth.firebaseapp.com"
            echo "VITE_FIREBASE_PROJECT_ID=iffl-auth"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=876749980452"
            echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
          } > .env
          npm run build

      - name: Deploy hosting + rules + functions
        run: |
          (cd functions && npm ci)
          firebase deploy --project iffl-auth --only hosting,firestore:rules,functions --non-interactive

      - name: Smoke — live site
        id: smoke
        continue-on-error: true
        run: |
          cd web
          npx playwright install --with-deps chromium
          sleep 20   # CDN propagation
          PW_PROJECT=live SMOKE_URL=https://iffl-auth.web.app npx playwright test --project=live
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

      - name: Auto-rollback hosting
        id: rollback
        if: steps.smoke.outcome == 'failure' && steps.prev.outputs.version != ''
        run: |
          firebase hosting:clone "iffl-auth@${{ steps.prev.outputs.version }}" iffl-auth:live --project iffl-auth   # site@VERSION, not site:@VERSION (that parses as a channel)
          echo "Rolled hosting back to ${{ steps.prev.outputs.version }}. Rules and functions were NOT rolled back."

      - name: Critical-process health
        id: health
        continue-on-error: true
        env:
          HEALTH_OUT: ${{ runner.temp }}/health.md
        run: node functions/scripts/check-health.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-report
          path: |
            ${{ runner.temp }}/health.md
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the run if smoke or health failed
        if: steps.smoke.outcome == 'failure' || steps.health.outcome == 'failure'
        run: exit 1

  # ── Deploy Captain (brain/deploy) — additive; the jobs above are Agent #1's and unchanged ──
  estate:
    # Test/deploy outcome into Supabase estate_events (urn est:deploy:iffl-app) for the status views.
    needs: [test, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ESTATE_SUPABASE_URL: ${{ secrets.ESTATE_SUPABASE_URL }}
      ESTATE_SUPABASE_ANON_KEY: ${{ secrets.ESTATE_SUPABASE_ANON_KEY }}
      ESTATE_INGEST_TOKEN: ${{ secrets.ESTATE_INGEST_TOKEN }}
      TEST: ${{ needs.test.result }}
      DEPLOY: ${{ needs.deploy.result }}
      SMOKE: ${{ needs.deploy.outputs.smoke }}
      ROLLED_BACK: ${{ needs.deploy.outputs.rolled_back }}
      PREV: ${{ needs.deploy.outputs.prev_version }}
      HEALTH: ${{ needs.deploy.outputs.health }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Report to estate
        run: |
          r=.github/estate-report.sh
          detail="{\"test\":\"$TEST\",\"deploy\":\"$DEPLOY\",\"smoke\":\"$SMOKE\",\"health\":\"$HEALTH\",\"rolled_back\":\"$ROLLED_BACK\",\"prev_version\":\"$PREV\"}"
          if [ "$SMOKE" = success ]; then
            bash $r probe ok "live smoke passed on iffl-auth.web.app" "$detail"
          elif [ "$SMOKE" = failure ]; then
            bash $r probe error "live smoke FAILED on iffl-auth.web.app" "$detail"
          fi
          if [ "$ROLLED_BACK" = true ]; then
            bash $r action warn "hosting rolled back to $PREV (rules + functions NOT rolled back)" "$detail"
          fi
          if [ "$TEST" != success ]; then
            status=error; summary="tests failed — nothing deployed"
          elif [ "$DEPLOY" = skipped ]; then
            status=ok; summary="tests green — deploy is on demand (not requested)"
          elif [ "$DEPLOY" = success ]; then
            status=ok; summary="green: test, deploy, live smoke, health"
          elif [ "$ROLLED_BACK" = true ]; then
            status=error; summary="live smoke failed — hosting rolled back to $PREV"
          elif [ "$HEALTH" = failure ]; then
            status=error; summary="deployed, but critical-process health check failed"
          else
            status=error; summary="deploy failed (deploy=$DEPLOY)"
          fi
          bash $r run "$status" "[$GITHUB_EVENT_NAME $GITHUB_REF_NAME] $summary" "$detail"

