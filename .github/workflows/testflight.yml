# RENDERED by brain/deploy/render.py (template: ios.yml) — edit there, then re-render.
# Deploy Captain: build → test → deploy → probe → rollback-on-fail → estate report → Claude fix PR.
name: Deploy Captain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-captain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ESTATE_SUPABASE_URL: ${{ secrets.ESTATE_SUPABASE_URL }}
  ESTATE_SUPABASE_ANON_KEY: ${{ secrets.ESTATE_SUPABASE_ANON_KEY }}
  ESTATE_INGEST_TOKEN: ${{ secrets.ESTATE_INGEST_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pods
        run: pod install
      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test -workspace CodeRed.xcworkspace -scheme CodeRed \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:CodeRedTests CODE_SIGNING_ALLOWED=NO | tail -200

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pods
        run: pod install
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      - name: Provisioning profile + export options
        env:
          PROFILE_B64: ${{ secrets.DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_B64: ${{ secrets.EXPORT_OPTIONS_BASE64 }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$dir"
          echo -n "$PROFILE_B64" | base64 --decode -o "$RUNNER_TEMP/p.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/p.mobileprovision" "$dir/$uuid.mobileprovision"
          echo -n "$EXPORT_B64" | base64 --decode -o "$RUNNER_TEMP/ExportOptions.plist"
      - name: Archive + export (build number = UTC timestamp, always increasing)
        run: |
          set -o pipefail
          xcodebuild -workspace CodeRed.xcworkspace -scheme CodeRed -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)" archive | tail -100
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/build" | tail -50
          ls "$RUNNER_TEMP"/build/*.ipa
      - uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/build/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      - name: Report upload
        run: bash .github/estate-report.sh probe ok "TestFlight upload accepted — processing on App Store Connect"

  report:
    if: always()
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Report run to estate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/verdict"
          import json, os
          n = json.loads(os.environ["NEEDS"])
          failed = [k for k, v in n.items() if v["result"] == "failure"]
          ran = [k for k, v in n.items() if v["result"] == "success"]
          if not failed:
              print("ok\tgreen: " + ", ".join(ran))
          elif n.get("rollback", {}).get("result") == "success":
              print("error\tfailed at %s — rolled back to last green" % ", ".join(failed))
          else:
              print("error\tfailed at " + ", ".join(failed))
          PY
          IFS=$'\t' read -r status summary < "$RUNNER_TEMP/verdict"
          bash .github/estate-report.sh run "$status" "[$GITHUB_EVENT_NAME $GITHUB_REF_NAME] $summary" "$NEEDS"

  claude-fix:
    # Main-branch failures only. Opens a fix PR; never pushes to main, never merges.
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [report]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Claude — diagnose and open fix PR
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Deploy Captain fixer for ${{ github.repository }}.
            The Deploy Captain workflow failed on `main` at ${{ github.sha }}.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            1. Read the failed logs: `gh run view ${{ github.run_id }} --log-failed`.
            2. If an open PR from a `claude/fix-*` branch already targets this failure,
               comment on it with the new evidence and stop.
            3. Root-cause it. "Flaky" is not a root cause.
               - Code/config cause → minimal fix on branch `claude/fix-${{ github.run_id }}`,
                 commit, push, and `gh pr create --base main` with a body stating
                 cause, fix, and how you verified it. Run the repo's build/test locally first.
               - Infra cause (missing secret, expired credential, host unreachable) → no code
                 change; open one issue titled "Deploy Captain: <cause>" with the exact fix
                 the owner must do, unless an open issue with that title exists.
            Never push to `main`. Never merge. Never skip, disable, or delete a test.
            Never commit secrets. Keep the diff minimal.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(pip:*),Bash(bash:*),Bash(ls:*),Bash(cat:*)"
