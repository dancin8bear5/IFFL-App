name: IFFL
options:
  bundleIdPrefix: com.iffl
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: LNHDZQ76WT
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0

targets:
  IFFL:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IFFL
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iffl.app
        # The IFFL team avatars are PNGs from a generator with non-standard chunks
        # that pngcrush rejects. Skip the PNG optimization step.
        COMPRESS_PNG_FILES: "NO"
        STRIP_PNG_TEXT: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: IFFL
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
    entitlements:
      path: IFFL/IFFL.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    info:
      path: IFFL/Info.plist
      properties:
        UIBackgroundModes:
          - remote-notification
        GIDClientID: 1018921424251-pm6hfho43sd9o2lbqb97o1d7ot1ss208.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1018921424251-pm6hfho43sd9o2lbqb97o1d7ot1ss208
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.iffl.app
            CFBundleURLSchemes:
              - iffl-app
        ITSAppUsesNonExemptEncryption: false
