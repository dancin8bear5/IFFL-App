<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFFL Big Board</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#181b16;--board2:#1f231c;--line:#3a4032;--chalk:#eef0e6;--chalk-dim:#9aa08f;
    --qb:#d9a84e;--rb:#4fae8b;--wr:#5f93d6;--te:#c96b3c;
    --keep:#57b26b;--drop:#d1595a;--maybe:#d9b34e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--board);color:var(--chalk);font-family:'IBM Plex Mono',monospace;min-height:100vh;padding:18px 14px 60px;}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:2px dashed var(--line);}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;letter-spacing:1px;text-transform:uppercase;margin:0;}
  h1 span{color:var(--maybe);}
  .sub{font-size:11px;color:var(--chalk-dim);}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center;}
  .postab,.teamsel{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);background:var(--board2);color:var(--chalk-dim);cursor:pointer;border-radius:3px;}
  .postab.active{color:var(--board);font-weight:600;}
  .postab[data-pos="ALL"].active{background:var(--chalk);border-color:var(--chalk);}
  .postab[data-pos="QB"].active{background:var(--qb);border-color:var(--qb);}
  .postab[data-pos="RB"].active{background:var(--rb);border-color:var(--rb);}
  .postab[data-pos="WR"].active{background:var(--wr);border-color:var(--wr);}
  .postab[data-pos="TE"].active{background:var(--te);border-color:var(--te);}
  .teamsel{color:var(--chalk);}
  #search{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--board2);border:1px solid var(--line);color:var(--chalk);padding:6px 10px;border-radius:3px;width:150px;}
  #search::placeholder{color:var(--chalk-dim);}
  .legend{display:flex;gap:10px;font-size:10px;color:var(--chalk-dim);flex-wrap:wrap;margin-bottom:14px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;}
  #capTable{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
  #capTable th{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chalk-dim);padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);}
  #capTable td{padding:4px 6px;border-bottom:1px solid rgba(58,64,50,0.4);}
  #capTable .team-name{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px;}
  #capTable .amt{font-weight:600;color:var(--keep);text-align:right;font-family:'IBM Plex Mono',monospace;}
  #capTable .cnt{color:var(--chalk-dim);text-align:right;font-family:'IBM Plex Mono',monospace;}
  #capTable .room{text-align:right;font-family:'IBM Plex Mono',monospace;}
  #capTable .room.tight{color:var(--drop);}
  #capTable .room.ok{color:var(--maybe);}
  #capTable .room.flush{color:var(--keep);}
  #capTable tr.total td{border-top:2px solid var(--line);font-weight:600;}
  .tier{margin-bottom:14px;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .tier-head{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;background:var(--board2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .tier-head .cnt{color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0;}
  .tier-head.pick-target{cursor:pointer;}
  .tier-head.pick-target:after{content:" \25b8 tap to place";font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--maybe);letter-spacing:0;}
  .tier-body{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-height:52px;}
  .tier-body.dragover{background:rgba(217,179,78,0.08);}
  .card{font-size:12px;padding:6px 8px;background:var(--board2);border:1px solid var(--line);border-left:4px solid var(--posc);border-radius:3px;cursor:grab;display:flex;align-items:center;gap:6px;user-select:none;transition:transform .08s ease;}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:0.35;}
  .card:hover{transform:translateY(-1px);}
  .card.selected{outline:2px solid var(--maybe);outline-offset:1px;background:#2a2e24;}
  .card .name{white-space:nowrap;}
  .card .meta{font-size:9px;color:var(--chalk-dim);letter-spacing:0.5px;white-space:nowrap;}
  .card .price{font-size:10px;color:var(--maybe);font-weight:600;}
  .kdm-group{display:flex;gap:2px;margin-left:auto;}
  .kdm{font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;letter-spacing:1px;padding:3px 6px;border-radius:2px;cursor:pointer;border:1px solid var(--line);color:var(--chalk-dim);background:transparent;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
  .kdm.active[data-k="K"]{color:#0d1a10;background:var(--keep);border-color:var(--keep);}
  .kdm.active[data-k="D"]{color:#1a0d0d;background:var(--drop);border-color:var(--drop);}
  .kdm.active[data-k="M"]{color:#1a170d;background:var(--maybe);border-color:var(--maybe);}
  .pick-banner{position:fixed;bottom:0;left:0;right:0;z-index:99;background:var(--maybe);color:var(--board);font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:10px 14px;display:none;}
  .pick-banner.show{display:block;}
  .status{font-size:10px;color:var(--chalk-dim);text-align:center;margin-top:12px;}
  .status.saving{color:var(--maybe);}
  .status.saved{color:var(--keep);}
  .status.error{color:var(--drop);}
  footer{margin-top:20px;font-size:10px;color:var(--chalk-dim);text-align:center;}
</style>
</head>
<body>
<header>
  <div><h1>THE BIG <span>BOARD</span></h1><div class="sub">MOON &middot; Supabase-backed &middot; tap K/D/M &middot; tap card then tier to move</div></div>
  <div class="controls">
    <div class="postab active" data-pos="ALL">All</div>
    <div class="postab" data-pos="QB">QB</div>
    <div class="postab" data-pos="RB">RB</div>
    <div class="postab" data-pos="WR">WR</div>
    <div class="postab" data-pos="TE">TE</div>
    <select id="teamFilter" class="teamsel"><option value="ALL">All Teams</option></select>
    <input id="search" placeholder="find player...">
  </div>
</header>
<div class="legend">
  <span><span class="dot" style="background:var(--qb)"></span>QB</span>
  <span><span class="dot" style="background:var(--rb)"></span>RB</span>
  <span><span class="dot" style="background:var(--wr)"></span>WR</span>
  <span><span class="dot" style="background:var(--te)"></span>TE</span>
  <span style="margin-left:10px;"><span class="dot" style="background:var(--keep)"></span>Keep</span>
  <span><span class="dot" style="background:var(--drop)"></span>Drop</span>
  <span><span class="dot" style="background:var(--maybe)"></span>Maybe</span>
</div>
<div id="capWrap" style="border:1px solid var(--line);border-radius:4px;background:var(--board2);padding:10px;margin-bottom:14px;">
  <table id="capTable"><thead><tr><th>Team</th><th style="text-align:right">Kept</th><th style="text-align:right">K$</th><th style="text-align:right">Auction $</th></tr></thead><tbody></tbody></table>
</div>
<div id="board"></div>
<div id="pickBanner" class="pick-banner">tap a tier to move player</div>
<div id="statusBar" class="status">loading from supabase...</div>
<footer>Changes save to Supabase instantly. No export needed.</footer>

<script>
const SB_URL = "https://vmambvgovdxepgejdgcy.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYW1idmdvdmR4ZXBnZWpkZ2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODczNDEsImV4cCI6MjEwMjA2MzM0MX0.oj4Tgbg-Y7mTiaB7QCAl2vx9WsxvJXJ4RV_AnhP4h0w";

const TIERS=["Superstars","Elite","Elite Cusp","Established Stars","Star Cusp","Potential Starters","Bench"];
const TEAMS=["TACO","JRDP","BILL","ARR","DPGE","PNP","BF","MOON","CATS","ZHOP","RYAN","GOP"];

let players=[];
let activePos="ALL",activeTeam="ALL",searchTerm="",selectedId=null;

function setStatus(msg,cls){const el=document.getElementById('statusBar');el.textContent=msg;el.className='status '+(cls||'');}

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":opts.prefer||"return=minimal"},
    ...opts
  });
  if(!res.ok) throw new Error(res.statusText);
  if(opts.method==="PATCH") return null;
  return res.json();
}

async function loadPlayers(){
  setStatus("loading...","saving");
  const data=await sbFetch("big_board?select=*&order=id");
  players=data.map(r=>({id:r.id,player:r.player,pos:r.pos,tier:r.tier,team:r.team,price:r.price,kdm:r.kdm}));
  setStatus(players.length+" players loaded","saved");
  render();
}

async function updatePlayer(p,fields){
  Object.assign(p,fields);
  render();
  setStatus("saving...","saving");
  try{
    await sbFetch("big_board?id=eq."+p.id,{method:"PATCH",body:JSON.stringify(fields)});
    setStatus("saved","saved");
  }catch(e){
    setStatus("save failed: "+e.message,"error");
  }
}

function setSelected(id){selectedId=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id==id));document.querySelectorAll('.tier-head').forEach(h=>h.classList.toggle('pick-target',!!id));document.getElementById('pickBanner').classList.toggle('show',!!id);}
function clearSelected(){selectedId=null;setSelected(null);}

function initTeamFilter(){
  const s=document.getElementById('teamFilter');
  TEAMS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o);});
  s.addEventListener('change',e=>{activeTeam=e.target.value;render();});
}

function updateCapTable(){
  const sums={};TEAMS.forEach(t=>{sums[t]={kept:0,salary:0};});
  players.forEach(p=>{if(p.kdm==='K'){sums[p.team].kept++;sums[p.team].salary+=p.price;}});
  const tbody=document.querySelector('#capTable tbody');tbody.innerHTML='';
  let totalK=0,totalSal=0,totalRoom=0;
  const sorted=TEAMS.slice().sort((a,b)=>sums[b].salary-sums[a].salary);
  sorted.forEach(t=>{
    const room=200-sums[t].salary;
    const cls=room<25?'tight':room<75?'ok':'flush';
    totalK+=sums[t].kept;totalSal+=sums[t].salary;totalRoom+=room;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="team-name">${t}</td><td class="cnt">${sums[t].kept}</td><td class="amt">$${sums[t].salary}</td><td class="room ${cls}">$${room}</td>`;
    tbody.appendChild(tr);
  });
  const tr=document.createElement('tr');tr.className='total';
  tr.innerHTML=`<td class="team-name">TOTAL</td><td class="cnt">${totalK}</td><td class="amt">$${totalSal}</td><td class="room">$${totalRoom}</td>`;
  tbody.appendChild(tr);
}

function render(){
  const board=document.getElementById('board');board.innerHTML='';
  TIERS.forEach(tierName=>{
    const wrap=document.createElement('div');wrap.className='tier';
    const head=document.createElement('div');head.className='tier-head';
    const inTier=players.filter(p=>p.tier===tierName);
    head.innerHTML=`<span>${tierName}</span><span class="cnt">${inTier.length}</span>`;
    head.addEventListener('click',()=>{
      if(selectedId){
        const p=players.find(x=>x.id==selectedId);
        if(p){updatePlayer(p,{tier:tierName});clearSelected();}
      }
    });
    const body=document.createElement('div');body.className='tier-body';
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('dragover');});
    body.addEventListener('dragleave',()=>body.classList.remove('dragover'));
    body.addEventListener('drop',e=>{
      e.preventDefault();body.classList.remove('dragover');
      const pid=e.dataTransfer.getData('text/plain');
      const p=players.find(x=>x.id==pid);
      if(p) updatePlayer(p,{tier:tierName});
    });

    players.forEach(p=>{
      if(p.tier!==tierName) return;
      if(activePos!=="ALL"&&p.pos!==activePos) return;
      if(activeTeam!=="ALL"&&p.team!==activeTeam) return;
      if(searchTerm&&!p.player.toLowerCase().includes(searchTerm)) return;

      const card=document.createElement('div');card.className='card';card.draggable=true;
      card.style.setProperty('--posc',`var(--${p.pos.toLowerCase()})`);
      card.dataset.id=p.id;
      const cur=p.kdm||'';
      card.innerHTML=`<span class="name">${p.player}</span><span class="meta">${p.pos}&middot;${p.team}</span><span class="price">$${p.price}</span><span class="kdm-group"><span class="kdm ${cur==='K'?'active':''}" data-k="K">K</span><span class="kdm ${cur==='D'?'active':''}" data-k="D">D</span><span class="kdm ${cur==='M'?'active':''}" data-k="M">M</span></span>`;

      card.addEventListener('click',e=>{
        if(e.target.closest('.kdm-group')) return;
        if(selectedId==p.id){clearSelected();return;}
        setSelected(p.id);
      });
      card.addEventListener('dragstart',e=>{clearSelected();e.dataTransfer.setData('text/plain',p.id);card.classList.add('dragging');});
      card.addEventListener('dragend',()=>card.classList.remove('dragging'));
      card.querySelectorAll('.kdm').forEach(btn=>{
        btn.addEventListener('click',e=>{
          e.stopPropagation();
          const val=btn.dataset.k;
          const newKdm=(p.kdm===val)?'M':val;
          updatePlayer(p,{kdm:newKdm});
        });
      });
      body.appendChild(card);
    });
    wrap.appendChild(head);wrap.appendChild(body);board.appendChild(wrap);
  });
  updateCapTable();
}

document.querySelectorAll('.postab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.postab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');activePos=tab.dataset.pos;render();
  });
});
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render();});

(async()=>{
  initTeamFilter();
  try{await loadPlayers();}catch(e){setStatus("failed to load: "+e.message,"error");}
})();
</script>
</body>
</html>
